## General Information

description: >
    This dataset represents the materials required to produce one [VEHICLE_CLASS]
    heavy-duty truck with a [POWERTRAIN] powertrain, based on GREET medium- and
    heavy-duty vehicle (MHDV) vehicle-cycle component bills of materials. The
    reference flow is 1 Item(s) of vehicle materials (not a full manufacturing
    inventory). Lifetime vehicle miles traveled in the source data are
    [LIFETIME_VMT] miles ([LIFETIME_KM] km); gross vehicle weight rating used
    in the source files is [GVWR_LBS] lb.

time_description: >
    Material composition and subsystem weights are from the GREET MHDV
    vehicle-cycle assessment published in 2021. They do not represent a specific
    model-year fleet mix.

geography_description: >
    United States average vehicle material composition applied nationally.

technology_description: >
    [VEHICLE_TECH]

vehicle_descriptions:
    Class 6 pickup and delivery: >
        Class 6 pickup-and-delivery truck as defined in the GREET MHDV
        vehicle-cycle report (medium heavy-duty, FHWA Class 6). Material
        inventory covers truck body, chassis, powertrain/transmission (as
        applicable), electric-drive components (as applicable), van-box, and
        lift-gates. Batteries, fluids, and tire replacements are excluded in v1.
    Class 8 day cab: >
        Class 8 day-cab combination tractor with trailer systems as defined in
        the GREET MHDV vehicle-cycle report. Material inventory covers truck
        body, chassis, powertrain/transmission (as applicable), electric-drive
        components (as applicable), and trailer body/chassis/auxiliary.
        Batteries, fluids, and tire replacements are excluded in v1.
    Class 8 sleeper cab: >
        Class 8 sleeper-cab combination tractor with trailer systems as defined
        in the GREET MHDV vehicle-cycle report. Material inventory covers truck
        body (including sleeper-related mass), chassis, powertrain/transmission
        (as applicable), electric-drive components (as applicable), and trailer
        body/chassis/auxiliary. Batteries, fluids, and tire replacements are
        excluded in v1.

## LCI method

inventory_method_description: >
    Subsystem weights from GREET Tables 17–19 are combined with material
    composition shares from Tables 23–25 to produce absolute material masses
    (lb) per vehicle. Masses are converted to kg for openLCA exchanges. GREET
    composite and each-of material rows are equal-split into named constituents
    before mapping to USLCI technosphere flows. The same USLCI flow may appear
    on multiple exchanges, distinguished by exchange description (vehicle
    component / subsystem).

modeling_constants_description: >
    Inventory remains in source pounds until processing; conversion uses
    1 lb = 0.45359237 kg. Functional unit is 1 vehicle (Item(s)), not
    mass- or distance-normalized.

## Data Source information

completeness_description: >
    This is a vehicle materials inventory (component bill of materials mapped
    to USLCI material production flows), not a complete vehicle manufacturing
    process. Explicitly excluded in v1: traction and lead-acid batteries;
    fluids; tire replacements and other lifetime replacements; forming,
    assembly, paint, and end-of-life. Materials without a USLCI target are
    retained as new product flows under Technosphere flows / CUTOFF Flows
    (no default provider); cut-off mass share is reported at build time. Some
    proxies are weak (see mapping Notes) and should be reviewed before Commons
    publication.

data_selection_description: >
    GREET MHDV vehicle-cycle component tables for Class 6 pickup and delivery,
    Class 8 day cab, and Class 8 sleeper cab. Processes are generated for all
    GREET powertrain columns (internal combustion engine, hybrid electric,
    battery electric, and fuel cell).

data_treatment_description: >
    Component labels lost in flat source CSVs were re-attached by aligning
    row blocks to Tables 17–19 × 23–25. Wheels and Tires combined weights are
    split equally to match source CSV tire/wheel amounts. Documented mass
    deltas versus Table 17–19 totals arise where composition percentages do
    not sum to 100% or where each-of rows encode a single share.

sampling_description: >
    Not applicable; secondary literature and model-based component tables.

data_collection_description: >
    Material masses transcribed / reconstructed from the 2021 GREET MHDV
    vehicle-cycle report; USLCI targets drafted from prior crosswalk and
    resolved against a USLCI exchange extract.

use_advice: >
    Import alongside USLCI so default providers on material exchanges resolve.
    Do not interpret these processes as full vehicle manufacturing. For
    freight LCIs, Phase B links these products into combination-truck
    transport processes at 1 / lifetime_tkm vehicles per t*km.

sources:
 - anl_greet_mhdv_2021: Iyer (2021) GREET MHDV vehicle-cycle LCI

